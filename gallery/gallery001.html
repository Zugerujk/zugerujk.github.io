                <img class="gallery_bar_photo" src="../blog/blog-media/132/132_37meandtheguywhoproducedsomething_sm.png" title="The final photo I took at SGDQ2026 — me and the guy I mentioned way way back, the guy I talked about Marathon with, who had been a tour guitar tech for some Millennial/Gen X band. And of COURSE his fucking name badge is cut off. I have another photo where the name badge isn't cut off, but that photo is BLURRY because I have SHAKY HANDS so it's, like, fuck, nightmare! Nightmare! Anyways yeah real cool dude. Listened to some music of his in the degen corner alongside Bonnie and Hayley and Morgan. I ran into him right after midnight and knew I should snap a selfie because I realized I didn't have any photo documentation of myself with him. I'm sooooo fucking shit at memory recall, I knew I'd never be able to remember stuff unless I had photos. But sadly I did not snap his name 😔. Anyways, after this, all I can really remember is that me and Taran did a sweep of the entire arcade (he really enjoyed some like death ball game where you're a wizard who can double jump? Or something?). Then we got breakfast together, but Caribou opened 30 minutes late, so we lazed around in the empty square that just 5.5 days prior had been fucking packed. Then he left real real early. My notes say he talked about Resident Evil and Valkyria Chronicles and Patapon... but not what we did! And then the true morning of the 7th day, like 8am-onwards, I can't remember, I don't really know what else I did, after. I remember Shadow was on the livestream for a, like, donation raffle prize showcase (cuz he makes swords (this time around he made Leon's axe)), not wearing his hat, and I saw his super bald head, and was fucking insane (because he ALWAYS wears his hat!). Then I went and chilled in the music room with Anon Nate Shelljump, but I don't remember what we talked about. I think, just. Similar stuff? I think he mentioned Dan Salvato's new game. Which, by the way, apparently Dan Salvato has been at both SGDQ 2025 and 2026, and literally everyone except me saw him? Or something like that? I have no idea. I've never seen him! And then I went home, around 11am. I had planned to stay later, initially, but. I was just so pooped. I went straight to bed, woke up around 9pm, and. Decided I wasn't gonna go back for the finale, 'cause I was so tired. I watched it on my computer, and. That was the end of SGDQ2026. Overall good (: ." onclick="galleryPhotoChange('../blog/blog-media/132/132_37meandtheguywhoproducedsomething.JPG', 'The final photo I took at SGDQ2026 — me and the guy I mentioned way way back, the guy I talked about Marathon with, who had been a tour guitar tech for some Millennial/Gen X band. And of COURSE his fucking name badge is cut off. I have another photo where the name badge isn\'t cut off, but that photo is BLURRY because I have SHAKY HANDS so it\'s, like, fuck, nightmare! Nightmare! Anyways yeah real cool dude. Listened to some music of his in the degen corner alongside Bonnie and Hayley and Morgan. I ran into him right after midnight and knew I should snap a selfie because I realized I didn\'t have any photo documentation of myself with him. I\'m sooooo fucking shit at memory recall, I knew I\'d never be able to remember stuff unless I had photos. But sadly I did not snap his name 😔. Anyways, after this, all I can really remember is that me and Taran did a sweep of the entire arcade (he really enjoyed some like death ball game where you\'re a wizard who can double jump? Or something?). Then we got breakfast together, but Caribou opened 30 minutes late, so we lazed around in the empty square that just 5.5 days prior had been fucking packed. Then he left real real early. My notes say he talked about Resident Evil and Valkyria Chronicles and Patapon... but not what we did! And then the true morning of the 7th day, like 8am-onwards, I can\'t remember, I don\'t really know what else I did, after. I remember Shadow was on the                 <img class="gallery_bar_photo" src="../blog/blog-media/132/132_36guitarheroing_sm.png" title="This photo was taken late night of day 6, after I had gone to bed and then woken up again. Taran stayed the whole night that night along with me. Here we are playing Guitar Hero or Rock Band!" onclick="galleryPhotoChange('../blog/blog-media/132/132_36guitarheroing.JPG', 'This photo was taken late night of day 6, after I had gone to bed and then woken up again. Taran stayed the whole night that night along with me. Here we are playing Guitar Hero or Rock Band!')">
                <img class="gallery_bar_photo" src="../blog/blog-media/132/132_35meandnateddr_sm.png" title="Me and Nate playing DDR, that morning of the 6th day. Gonna recount the rest of the morning, as I have no photos until the late night of the 6th! After previous photo, Nate started talking my up and boosting the shit out of my ego. How he thinks I'm goated at kaizo, and how I'm maybe the best Inpulse player, and how he thought it was truly not possible I got as far as I did in the Inpulse cube on my first time trying the game with no Kaizo experience. Then I ran some bit about Alan Wake 2, which I don't remember the details of. Then just me and Nate did Bad Apple DDR, to wake ourselves up, and I fucking, oh my god, I died. Then we Inpulsed some more, and he made a level based on the idea of a 'red note and bouncy spring'. Then I made a level, which. He said I could make a level for the final game and have his sprite person do full art for it. So I made a level with nondeterminative RNG, using the only interaction in the game (it's broken, unfixable) that has that, and it was soooo fucking fun and funny. He seemed a little upset but I was having a great time. Then we BOTH played Guitar Hero. It was awesome. Then we watched carlsagan42 showcase his indie game to people — and, like, I had no idea it was literally carlsagan42 until the other guy he was showing it to finished it and the credits said 'by carlsagan42' and I laughed and thought it was a joke for like a second before realizing, shit, it's actually carlsagan42. 'Cause Nate was just calling him 'Carl'! Then Carl and Nate talked about carlsagan42's indie game for quiiiiiite a while, and made a shitton of jokes about Kaizo level editor stuff which went wayyyy over my head. My notes say 'Feeling like Graggle Simpson rn' which like soooooo true. I actually came up in conversation because Inpulse came up so I talked and joked around a bit, and carlsagan42 laughed at THREE of my jokes. I was completely normal in the presence of a personal celebrity. Big news for Zug nation. Then Nate and I went to the music room, and jammed out, and I played violin there, and after 6ish years of not playing, the muscle memory just came back instantly. 'Cause I'm a classically-trained violinist. Not to brag. Nate walked me through how to play along to the chords of the song he was strumming to — something from Inpulse, if I remember — and then I hit the drums a bunch. And then just listened to Nate strum the guitar there. 'How beautiful a sound'. Damn, we talked for an hour in there, according to my notes. We get along real fucking well. We talked about our games, and what they meant to us, and what we'd worked on. And a lot of life stuff. Then we went and got breakfast, at 7 AM, and I got an iced mocha with a grilled cheese, and he got some bagel thing and a white blended drink and a Diet Coke he chugged. And he talked about his life, how he used to be a teacher, and how academia crushed his spirits, how he teaches math Olympiad high schoolers now for like 6 remote hours a week, makes hella good money. Likes snowboarding, and beatmania. I talked about my life, college, plans. He encouraged me to do some shit. And we talked about speedrunning celebrities at GDQ, and it was very funny because I didn't know like any of the ones he saw as like sky-high figures, meanwhile like 5 hours before it turns out he's on a first-name basis with carlsagan42. Aaahhh. Good shit. Morning of the 6th day — another day 2/3. The Aussie Snowboard Kids runner and Nate, they made SGDQ2026, I'm telling you." onclick="galleryPhotoChange('../blog/blog-media/132/132_35meandnateddr.JPG', 'Me and Nate playing DDR, that morning of the 6th day. Gonna recount the rest of the morning, as I have no photos until the late night of the 6th! After previous photo, Nate started talking my up and boosting the shit out of my ego. How he thinks I\'m goated at kaizo, and how I\'m maybe the best Inpulse player, and how he thought it                 <img class="gallery_bar_photo" src="../blog/blog-media/132/132_34meandnate_sm.png" title="So Nate Anon Shelljump, the guy I met last year playing his indie game (which I was extremely good at, as a kaizo noob, and he showed me off to people like a show horse, and then I became a playtester), was at the event almost the whole time, but we only ran into each other on the fifth day! He hung out at the center of the practice room, where I never went, so even though the room was quite small, we just, never were near each other at the same time. Anyways, before the very depressing stairwell, around 5:30pmish, we met up. And then we talked about Inpulse while some guy (amongst his buddies, the Super Mario World romhack scene) played Inpulse. Then Nate played Not in the Groove 2, and then I tried Not in the Groove 2, and me and him and his buddies talked about, like, Mario World romhacking? I mostly listened along. There was a guy playing an auto-mario hack, I remember. Then I went and got Chipotle, as him and his group went and got dinner on their own (I was invited but decided not to come, I was feeling very depressed). Got back, uh, went to the corner of the practice room, tried to get Godot open on my laptop (to work on IOODancing), but my laptop has a wicked soul. And then the very depressing stairwell happened. And then after talking to the cleaner, I had cheered up, and went down to the practice room, and ran into Nate Anon Shelljump. And here we are, with a third guy, at 2AM. Before this photo they were playing a 2-player hack, I'm pretty sure. In this photo they're talking about Super Mario World Cape strats, and how the timing works, and how speed works. I remember bits and pieces. Kind of a nightmare, cape stuff!" onclick="galleryPhotoChange('../blog/blog-media/132/132_34meandnate.JPG', 'So Nate Anon Shelljump, the guy I met last year playing his indie game (which I was extremely good at, as a kaizo noob, and he showed me off to people like a show                 <img class="gallery_bar_photo" src="../blog/blog-media/132/132_31meinvr_sm.png" title="Me in the VR setup Medecins Sans Frontieres had for a VR art piece about a man's very difficult life, though unfortunately I don't remember where. It's called 'Forced to Hope', if you wanna look it up. Photo taken by Taran. Taran and I would've probably just been coming back from lunch, where we went to Qdoba. We couldn't actually find our way inside the building from Apple Maps. Turns out the Qdoba was in the skyway! But we randomly ran into ShadowInsignus, who's an acquaintance I met during SGDQ2025, and he like kind of tried to help guide us. It was crazy just running into him like 6 blocks from the Hilton. The whole third floor vendor alley was actually suuuuuper awkward on the last 3 days, 'cause one of the vendors was a guy I had talked to on fucking Scruff like a month prior! We didn't do anything (I had zero luck on Scruff (and I'm now off all the apps, currently)), but. Awkward as shitttttt. I avoided him the entire time." onclick="galleryPhotoChange('../blog/blog-media/132/132_31meinvr.JPG', 'Me in the VR setup Medecins Sans Frontieres had for a VR art piece about a man\'s very difficult life, though unfortunately I don\'t remember where. It\'s called \'Forced to Hope\', if you wanna look it up. Photo taken by Taran. Taran and I would\'ve probably just been coming back from lunch, where we went to Qdoba. We couldn\'t actually find our way inside the building from Apple Maps. Turns out the Qdoba was in the skyway! But we randomly ran into ShadowInsignus, who\'s an acquaintance I met during SGDQ2025, and he like kind of tried to help guide us. It was crazy just running into him like 6 blocks from the Hilton. The whole third floor vendor alley was actually suuuuuper awkward on the last 3 days, \'cause one of the vendors was a guy I had talked to on fucking Scruff like a month prior! We didn\'t do anything (I had zero luck on Scruff (and I\'m now off all the                 <img class="gallery_bar_photo" src="../blog/blog-media/132/132_30playingufo50_sm.png" title="Me and Taran playing UFO 50, the afternoon of day 5. These later ones, I was feeling really depressed and bad, 'cause after I feel really good I usually feel really bad (and vice-versa). And day 2/3 was just. It was so good. Also this morning, of the fifth, I had an apartment tour. Didn't end up choosing it. Smelled like mold. Went to Barnes and Noble beforehand and bought an $8 Blu-ray of Blade Runner and a copy of Collapse: The Fall of the Soviet Union. Got this like weird strawberry shake from the Barnes and Noble Starbucks. Let's hear it for the morning of Day 5! I should say, right before this, we played some Tetris (in the arcade room) and some Puyo Puyo (in the practice room), and. Unfortunately, I like totally smoked him in both. I was really into Puyo Puyo Tetris like 8 or 9 years ago as a teenager, so I'm permanently much better than average person about both Puyo Puyo and Tetris, but also I'm not good, I'm like, okay, so against someone who's GOOD, I will lose. Which is unfortunate because they are very fun versus games." onclick="galleryPhotoChange('../blog/blog-media/132/132_30playingufo50.JPG', 'Me and Taran playing UFO 50, the afternoon of day 5. These later ones, I was feeling really depressed and bad, \'cause after I feel really good I usually feel really bad (and vice-versa). And day 2/3 was just. It was so good. Also this morning, of the fifth, I had an apartment tour. Didn\'t end up choosing it. Smelled like mold. Went to Barnes and Noble beforehand and bought an $8 Blu-ray of Blade Runner and a copy of Collapse: The Fall of the Soviet Union. Got this like weird strawberry shake from the Barnes and Noble Starbucks. Let\'s hear it for the morning of Day 5! I should say, right before this, we played some Tetris (in the arcade room) and some Puyo Puyo (in the practice room), and. Unfortunately, I like totally smoked him in both. I was really                 <img class="gallery_bar_photo" src="../blog/blog-media/132/132_28walkingtoday4_sm.png" title="Big time skip between the last photo and this one — a whole 31 hours (I think if I do the math right)! Yeah after the fucking, perfect, I guess, day 2 night & day 3 morning, I was fucking poooped. So I just didn't go back, night of day 3. I stayed home, I think I played some Marathon? And, uh. Then I went back, the morning of the fourth day. It was raining, a shitton, I felt like a god in the Caribou Coffee next to the Hilton because I had brought an umbrella when NOBODY ELSE HAD. Mwuahahaha... Then I just, I don't know, spent my time there? I think I was extremely depressed that day, as I took zero photos, and didn't really talk about anything. I know I played classic Marathon on my Steam Deck, in the stream room, and talked with the guy who had done guitar tour tech for some like millennial/gen x band (who I think is the last photo in this gallery) about Marathon, and also talked with him about nuMarathon. But man. Day 4 was just very empty emotionally. Now it's afternoon of day 4, this selfie, as I'm walking from the venue, back home. Banger fit IMO, and the best photo I've taken of myself in a long long time." onclick="galleryPhotoChange('../blog/blog-media/132/132_28walkingtoday4.JPG', 'Big time skip between the last photo and this one — a whole 31 hours (I think if I do the math right)! Yeah after the fucking, perfect, I guess, day 2 night & day 3 morning, I was fucking poooped. So I just didn\'t go back, night of day 3. I stayed home, I think I played some Marathon? And, uh. Then I went back, the morning of the fourth day. It was raining, a shitton, I felt like a god in the Caribou Coffee next to the Hilton because I had brought an umbrella when NOBODY ELSE HAD. Mwuahahaha... Then I just, I don\'t know, spent my time there? I think I was extremely depressed that day, as I took zero photos, and didn\'t really talk about anything. I know I played classic Marathon on my Steam Deck, in the stream room, and talked with the guy who had done guitar tour tech for some like millennial/gen x band (who I think is the last photo in this gallery) about Marathon, and also talked with him about nuMarathon. But man. Day 4 was just very empty emotionally. Now it\'s afternoon of day 4, this selfie, as I\'m walking from the venue, back home. Banger fit IMO, and the best photo I\'ve taken of myself in a long long time.')">

                <img class="gallery_bar_photo" src="../blog/blog-media/132/132_22meandaussiecommentator_sm.png" title="Me and the aussie Snowboard Kids commentator whose name I never got though I could probably look up the VOD. We ended up meeting up the morning of the third day, which — okay, so much fucking happened between the night of the second and the morning of the third. After Chunithm, me and Taran watched Mario Odyssey, and then we went to Chipotle (where I tried their lime sauce, it was fine?), and then I played a shittonnnnn of Guitar Hero, and then Taran left, then I smoked some weed, and then the Battle for Bikini Bottom practice room race happened where Jack softlocked (RIP), then the guys there showed me Vertical Momentum Storage, then the XBOX's disc drive stopped opening (so I couldn't swap out games), then I went to the stream room, then I watched the Ogre Battle run, and THEN, FINALLY, I went for a walk to find somewhere to linger. And I found the Aussie Snowboard Kids commentator in the music room (where people set up a shitton of instruments, that you can just jam with), going full one-man-band mode. And then we just talked, for a while, I was a little high and he was very drunk, and. It was fuckingggg wonderful. He's an amazing dude. I remember talking about getting breakfast (because at the point the photo was taken it was 5:17 AM), and I mentioned how my coffee order is alwayssss a medium dark chocolate iced mocha with 2%, and he said, fuckin', that he always has just normal-ass black coffee and holds off all sweet stuff, and then when the occasion finally feels right, he'll have a hot chocolate. Such a cool dude." onclick="galleryPhotoChange('../blog/blog-media/132/132_22meandaussiecommentator.JPG', 'Me and the aussie Snowboard Kids commentator whose name I never got though I could probably look up the VOD. We ended up meeting up the morning of the third day, which — okay, so much fucking happened between the night of the second and the mor
